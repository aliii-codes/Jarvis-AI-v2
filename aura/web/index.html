<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AURA</title>
  <link rel="stylesheet" href="vendor/hl-dark.css" id="hl-theme">
  <link rel="stylesheet" href="app.css">
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span id="assistant-name">AURA</span>
    </div>
    <div class="topbar-right">
      <span id="status" class="status"><span class="dot"></span><span class="label">ready</span></span>
      <button id="memory-btn" class="icon-btn" title="Memory" aria-label="Memory">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z"/></svg>
      </button>
      <button id="new-chat" class="icon-btn" title="New chat" aria-label="New chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>
  </header>

  <main id="scroll">
    <section id="welcome" class="column welcome" hidden>
      <div class="mark mark-lg" aria-hidden="true"></div>
      <h1 id="greeting">Hello</h1>
      <p class="sub">What can I do for you?</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="What's the weather like today?">
          <span class="s-title">Check the weather</span><span class="s-sub">for today</span></button>
        <button class="suggestion" data-prompt="Translate what I copied to English">
          <span class="s-title">Translate</span><span class="s-sub">what I copied</span></button>
        <button class="suggestion" data-prompt="Remind me in 20 minutes to take a break">
          <span class="s-title">Remind me</span><span class="s-sub">in 20 minutes to take a break</span></button>
        <button class="suggestion" data-prompt="What are today's top tech headlines?">
          <span class="s-title">Today's tech news</span><span class="s-sub">top headlines</span></button>
      </div>
    </section>
    <div id="thread" class="column"></div>
  </main>

  <footer class="dock">
    <div class="column">
      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Message AURA…" autocomplete="off"></textarea>
        <button id="send" class="send" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </form>
      <div class="hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</div>
    </div>
  </footer>

  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="memory-panel" class="drawer" aria-label="Memory" aria-hidden="true">
    <div class="drawer-head">
      <h2>Memory</h2>
      <button id="memory-close" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <p class="drawer-sub">What <span class="assistant-name">AURA</span> remembers about you. Stored only on this computer.</p>
      <label class="switch-row">
        <span><b>Learn from conversations</b><small>Picks up lasting facts a moment after you chat</small></span>
        <input type="checkbox" id="learning-toggle"><span class="switch" aria-hidden="true"></span>
      </label>

      <h3>About you <span id="facts-count" class="count"></span></h3>
      <form id="add-fact" class="add-fact">
        <input id="fact-input" placeholder="Add something it should know…" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <ul id="facts" class="mem-list"></ul>
      <p id="facts-empty" class="empty" hidden>Nothing yet. Tell it about yourself, or add something above.</p>

      <h3>Recent days</h3>
      <ul id="days" class="mem-list"></ul>
      <p id="days-empty" class="empty" hidden>No notes yet.</p>

      <button id="forget-all" class="danger-link" type="button">Forget everything</button>
    </div>
  </aside>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
